<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Innocent One | Gothic Viking Fate</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.min.js"></script>
  <style>
    :root {
      --bg-dark: #070509;
      --card-bg: rgba(18, 12, 24, 0.96);
      --gold: #f3e5ab;
      --gold-bright: #ffd700;
      --red-accent: #8b0000;
      --red-glow: #ff2a2a;
      --blue-accent: #1e3f66;
      --blue-glow: #00bfff;
      --text-light: #f7f2fc;
      --text-muted: #c2b2d2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 20%, #2a1235 0%, #070509 70%),
        repeating-linear-gradient(45deg, rgba(212, 175, 55, 0.015) 0px, rgba(212, 175, 55, 0.015) 2px, transparent 2px, transparent 40px);
      color: var(--text-light);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      max-width: 700px;
      width: 100%;
      background: var(--card-bg);
      border: 2px solid #5a3d6e;
      box-shadow: 0 0 50px rgba(0,0,0,0.95), inset 0 0 25px rgba(212, 175, 55, 0.12);
      border-radius: 18px;
      padding: 35px;
      text-align: center;
      position: relative;
    }

    /* Ambient Rune Watermark */
    .container::before {
      content: "ᚱᚢᚾᛖ";
      position: absolute;
      top: 15px;
      right: 25px;
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      color: rgba(212, 175, 55, 0.25);
      letter-spacing: 5px;
      pointer-events: none;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-weight: 900;
      color: var(--gold);
      font-size: 2.3rem;
      letter-spacing: 3px;
      margin-bottom: 5px;
      text-shadow: 0 0 15px rgba(243, 229, 171, 0.5);
      background: linear-gradient(180deg, #fff 0%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-bottom: 25px;
      text-transform: uppercase;
    }

    /* Luxury Dashboard Tally */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      background: rgba(10, 6, 15, 0.9);
      border: 1px solid #4a305e;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 25px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .stat-value {
      color: var(--gold-bright);
      font-weight: 700;
      font-size: 1.2rem;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
    }

    .game-panel { display: none; }
    .game-panel.active { display: block; animation: fadeIn 0.4s ease-in-out; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Quiz Box Styling */
    .quiz-box {
      background: rgba(14, 9, 20, 0.9);
      border: 1px solid #503766;
      border-radius: 14px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      color: var(--gold);
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .question-title {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      color: #ffffff;
      margin-bottom: 25px;
      line-height: 1.6;
      font-weight: 700;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 25px;
    }

    .option-btn {
      background: linear-gradient(135deg, #22172e, #140d1c);
      border: 1px solid #5a3d73;
      color: var(--text-light);
      padding: 16px 20px;
      border-radius: 10px;
      font-family: 'Montserrat', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .option-btn:hover {
      border-color: var(--gold);
      background: linear-gradient(135deg, #322144, #1b1126);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.15);
    }

    .option-btn.correct {
      background: linear-gradient(135deg, #0f4a26, #072613) !important;
      border-color: #2ecc71 !important;
      color: #2ecc71 !important;
      font-weight: 700;
      box-shadow: 0 0 20px rgba(46, 204, 113, 0.3) !important;
    }

    .option-btn.wrong {
      background: linear-gradient(135deg, #591212, #290505) !important;
      border-color: #e74c3c !important;
      color: #e74c3c !important;
      box-shadow: 0 0 20px rgba(231, 76, 60, 0.3) !important;
    }

    .next-btn {
      background: linear-gradient(135deg, #593c70, #332042);
      border: 2px solid var(--gold);
      color: var(--gold);
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 14px 35px;
      border-radius: 30px;
      cursor: pointer;
      display: none;
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.25);
      transition: all 0.3s ease;
    }

    .next-btn:hover {
      background: linear-gradient(135deg, #6d4b87, #422a55);
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
      transform: scale(1.03);
    }

    /* Dice Panel Styling */
    .dice-area {
      display: flex;
      justify-content: space-around;
      margin: 30px 0;
      gap: 20px;
    }

    .dice-box {
      flex: 1;
      background: rgba(10, 6, 15, 0.85);
      border-radius: 14px;
      padding: 20px 10px;
      border: 1px solid #4a305e;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
    }

    .dice {
      width: 90px;
      height: 90px;
      margin: 15px auto;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      font-weight: 700;
      font-family: 'Cinzel', serif;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6), inset 0 0 15px rgba(255,255,255,0.1);
    }

    .dice-red {
      background: linear-gradient(145deg, #6b0000, #260000);
      border: 2px solid var(--red-glow);
      color: #ffcccc;
      text-shadow: 0 0 12px var(--red-glow);
    }

    .dice-blue {
      background: linear-gradient(145deg, #0d325c, #030f1c);
      border: 2px solid var(--blue-glow);
      color: #ccf2ff;
      text-shadow: 0 0 12px var(--blue-glow);
    }

    .roll-btn {
      background: linear-gradient(180deg, #9e0b0b 0%, #4a0000 100%);
      border: 2px solid var(--gold);
      color: var(--gold);
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 1.3rem;
      padding: 16px 45px;
      border-radius: 35px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 0 30px rgba(158, 11, 11, 0.7);
      transition: all 0.3s ease;
    }

    .roll-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.6);
    }

    .result-card {
      margin-top: 30px;
      background: rgba(14, 9, 20, 0.95);
      border: 2px dashed var(--gold);
      border-radius: 14px;
      padding: 25px;
      display: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      animation: fadeIn 0.5s ease;
    }

    .action-btn {
      background: linear-gradient(135deg, #3d2a4a, #23172e);
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: 'Cinzel', serif;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: #543b66;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }

    /* Wrong screen shake */
    @keyframes screenShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake-anim {
      animation: screenShake 0.4s ease-in-out;
    }
  </style>
</head>
<body>

  <div class="container" id="mainContainer">
    <h1>The Innocent One's Trial</h1>
    <div class="subtitle">ᚱᚢᚾᛖ Knowledge, Fate & Consequences ᚱᚢᚾᛖ</div>

    <div class="dashboard">
      <div class="stat-box"><span class="stat-label">Correct</span><span class="stat-value" id="correctCount" style="color: #2ecc71;">0</span></div>
      <div class="stat-box"><span class="stat-label">Wrong</span><span class="stat-value" id="wrongCount" style="color: #e74c3c;">0</span></div>
      <div class="stat-box"><span class="stat-label">Level</span><span class="stat-value" id="diffLevel">1</span></div>
      <div class="stat-box"><span class="stat-label">Streak</span><span class="stat-value" id="streakCount">0</span></div>
    </div>

    <!-- QUIZ PANEL -->
    <div id="quizPanel" class="game-panel active">
      <div class="quiz-box">
        <div class="question-header">
          <span id="questionCategory">Category</span>
          <span id="questionTierText">Tier: 1</span>
        </div>
        <div class="question-title" id="questionText">Loading...</div>
        <div class="options-grid" id="optionsGrid"></div>
        <button class="next-btn" id="nextQuestionBtn">Next Question ➔</button>
      </div>
    </div>

    <!-- DICE PANEL -->
    <div id="dicePanel" class="game-panel">
      <div style="font-family: 'Cinzel', serif; color: var(--gold); margin-bottom: 20px; font-size: 1.25rem;" id="diceInstruction">Fate is sealed! Cast your dice.</div>
      <div class="dice-area">
        <div class="dice-box">
          <div style="color: #ff6b6b; font-family: 'Cinzel', serif; font-weight: 600;">Action (Red)</div>
          <div class="dice dice-red" id="diceRed">ᚠ</div>
        </div>
        <div class="dice-box">
          <div style="color: #64dfdf; font-family: 'Cinzel', serif; font-weight: 600;">Duration (Blue)</div>
          <div class="dice dice-blue" id="diceBlue">ᚢ</div>
        </div>
      </div>
      <button class="roll-btn" onclick="rollDice()">Cast the Dice</button>
      <div class="result-card" id="resultCard">
        <h3 id="resultHeader" style="font-family:'Cinzel',serif; color:var(--gold); font-size: 1.4rem; margin-bottom:12px;">Fate Has Decided</h3>
        <div class="outcome-text" style="font-size: 1.2rem; line-height: 1.7;">
          <span id="redOutcome" style="color:#ff6b6b; font-weight:700;"></span><br>
          <span id="blueOutcome" style="color:#64dfdf; font-weight:700;"></span>
        </div>
        <button class="action-btn" onclick="resetToQuiz()">Return to Trial</button>
      </div>
    </div>
  </div>

  <script>
    const questionBank = {
      1: [
        { category: "Geography", q: "What is the capital city of Scotland?", options: ["Glasgow", "Edinburgh", "Aberdeen", "Dundee"], answer: 1 },
        { category: "Pop Culture", q: "Which element on the periodic table has the chemical symbol 'O'?", options: ["Gold", "Osmium", "Oxygen", "Zinc"], answer: 2 },
        { category: "General Knowledge", q: "How many sides does a standard hexagon have?", options: ["5", "6", "7", "8"], answer: 1 }
      ],
      2: [
        { category: "History", q: "In which year did the Battle of Hastings take place in England?", options: ["1066", "1215", "1415", "1588"], answer: 0 },
        { category: "Nature & Animals", q: "What is the largest mammal currently living on Earth?", options: ["African Elephant", "Blue Whale", "Colossal Squid", "Giraffe"], answer: 1 },
        { category: "Literature", q: "Who wrote the classic Gothic novel 'Frankenstein'?", options: ["Bram Stoker", "Mary Shelley", "Jane Austen", "Charles Dickens"], answer: 1 }
      ],
      3: [
        { category: "Human Anatomy", q: "Which organ in the human body consumes roughly 20% of the body's total oxygen intake?", options: ["Lungs", "Heart", "Liver", "Brain"], answer: 3 },
        { category: "World History", q: "Which ancient civilization constructed the city of Machu Picchu high in the Andes?", options: ["Aztecs", "Mayans", "Incas", "Toltecs"], answer: 2 },
        { category: "Physics & Chemistry", q: "What is the hardest naturally occurring substance found on Earth?", options: ["Titanium", "Diamond", "Quartz", "Graphene"], answer: 1 }
      ],
      4: [
        { category: "Astronomy & Physics", q: "What is the theoretical boundary surrounding a black hole beyond which nothing can escape?", options: ["Photon Sphere", "Singularity", "Event Horizon", "Accretion Disk"], answer: 2 },
        { category: "World History", q: "Who was the first Emperor of a unified China, famous for his Terracotta Army?", options: ["Qin Shi Huang", "Kublai Khan", "Sun Tzu", "Emperor Wu of Han"], answer: 0 },
        { category: "Classical Literature", q: "In Norse mythology, what is the name of the great hall ruled over by the god Odin?", options: ["Asgard", "Valhalla", "Midgard", "Niflheim"], answer: 1 }
      ],
      5: [
        { category: "Philosophy & Science", q: "Which ancient philosopher formulated the famous line 'I think, therefore I am' (Cogito, ergo sum)?", options: ["Spinoza", "Immanuel Kant", "René Descartes", "Friedrich Nietzsche"], answer: 2 },
        { category: "Botany & Science", q: "What pigment gives red, purple, and blue plants their vibrant colors and acts as an antioxidant?", options: ["Chlorophyll", "Anthocyanin", "Carotenoid", "Xanthophyll"], answer: 1 },
        { category: "History & Antiquity", q: "The Roman Empire reached its greatest geographical expanse under which Emperor in 117 AD?", options: ["Augustus", "Trajan", "Hadrian", "Marcus Aurelius"], answer: 1 }
      ]
    };

    let currentLevel = 1;
    let streak = 0;
    let totalCorrect = 0;
    let totalWrong = 0;
    let currentQ = null;
    let activeRuleKey = null;

    const rules = {
      right3: {
        title: "3 Right in a Row — Reward",
        red: { 1: "Lick ass", 2: "Suck cock", 3: "Kiss", 4: "Ball play", 5: "Lick ass & milk cock together", 6: "Lick nipples" },
        blue: { 1: "5 mins", 2: "10 times", 3: "15 seconds", 4: "15 times", 5: "10 mins", 6: "You choose" }
      },
      wrong2: {
        title: "2 Wrong in a Row — Penance",
        red: { 1: "Smack in ass", 2: "Pull nipples", 3: "Bite neck", 4: "Slap cock", 5: "Slap face", 6: "U choose" },
        blue: { 1: "10 second", 2: "4 times", 3: "U choose", 4: "15 times", 5: "5 mins", 6: "I choose" }
      }
    };

    function loadQuestion() {
      const nextBtn = document.getElementById('nextQuestionBtn');
      nextBtn.style.display = 'none';

      const tierList = questionBank[currentLevel] || questionBank[1];
      currentQ = tierList[Math.floor(Math.random() * tierList.length)];

      document.getElementById('questionCategory').innerText = currentQ.category;
      document.getElementById('questionTierText').innerText = `Tier: ${currentLevel}`;
      document.getElementById('questionText').innerText = currentQ.q;

      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';
      currentQ.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<b>${String.fromCharCode(65 + idx)}.</b> ${opt}`;
        btn.onclick = () => selectOption(idx, btn);
        grid.appendChild(btn);
      });
    }

    function selectOption(idx, clickedBtn) {
      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(b => b.disabled = true);

      const isCorrect = (idx === currentQ.answer);
      const nextBtn = document.getElementById('nextQuestionBtn');

      if (isCorrect) {
        clickedBtn.classList.add('correct');
        totalCorrect++;
        streak = streak < 0 ? 1 : streak + 1;
        if (streak >= 3 && currentLevel < 5) currentLevel++;

        nextBtn.style.display = 'inline-block';
        if (streak >= 3) {
          nextBtn.innerText = 'Cast Reward Dice ➔';
          nextBtn.onclick = function() { triggerDice('right3'); };
        } else {
          nextBtn.innerText = 'Next Question ➔';
          nextBtn.onclick = function() { loadQuestion(); };
        }

        try {
          if (typeof confetti === 'function') {
            confetti({ particleCount: 110, spread: 80, origin: { y: 0.6 }, colors: ['#ffd700', '#2ecc71', '#ffffff'] });
          }
        } catch (e) {}

      } else {
        clickedBtn.classList.add('wrong');
        allBtns[currentQ.answer].classList.add('correct');
        totalWrong++;
        streak = streak > 0 ? -1 : streak - 1;

        // Dramatic screen tremor on wrong answer
        const container = document.getElementById('mainContainer');
        container.classList.add('shake-anim');
        setTimeout(() => container.classList.remove('shake-anim'), 400);

        nextBtn.style.display = 'inline-block';
        if (streak <= -2) {
          nextBtn.innerText = 'Cast Penance Dice ➔';
          nextBtn.onclick = function() { triggerDice('wrong2'); };
        } else {
          nextBtn.innerText = 'Next Question ➔';
          nextBtn.onclick = function() { loadQuestion(); };
        }
      }

      updateDashboard();
    }

    function updateDashboard() {
      document.getElementById('correctCount').innerText = totalCorrect;
      document.getElementById('wrongCount').innerText = totalWrong;
      document.getElementById('diffLevel').innerText = currentLevel;
      document.getElementById('streakCount').innerText = streak;
    }

    function triggerDice(ruleKey) {
      activeRuleKey = ruleKey;
      document.getElementById('quizPanel').classList.remove('active');
      document.getElementById('dicePanel').classList.add('active');
      document.getElementById('diceInstruction').innerText = `Triggered: ${rules[ruleKey].title}! Cast the dice.`;
      document.getElementById('resultCard').style.display = 'none';
      document.getElementById('diceRed').innerText = 'ᚠ';
      document.getElementById('diceBlue').innerText = 'ᚢ';
    }

    function resetToQuiz() {
      streak = 0;
      updateDashboard();
      document.getElementById('dicePanel').classList.remove('active');
      document.getElementById('quizPanel').classList.add('active');
      loadQuestion();
    }

    function rollDice() {
      const redDice = document.getElementById('diceRed');
      const blueDice = document.getElementById('diceBlue');
      const resultCard = document.getElementById('resultCard');
      resultCard.style.display = 'none';

      let count = 0;
      const interval = setInterval(() => {
        redDice.innerText = Math.floor(Math.random() * 6) + 1;
        blueDice.innerText = Math.floor(Math.random() * 6) + 1;
        count++;
        if (count > 10) {
          clearInterval(interval);
          const rVal = Math.floor(Math.random() * 6) + 1;
          const bVal = Math.floor(Math.random() * 6) + 1;
          redDice.innerText = rVal;
          blueDice.innerText = bVal;

          const ruleSet = rules[activeRuleKey];
          document.getElementById('resultHeader').innerText = ruleSet.title;
          document.getElementById('redOutcome').innerText = `Action: ${ruleSet.red[rVal]}`;
          document.getElementById('blueOutcome').innerText = `Duration/Count: ${ruleSet.blue[bVal]}`;
          resultCard.style.display = 'block';
        }
      }, 70);
    }

    window.onload = loadQuestion;
  </script>
</body>
</html>
