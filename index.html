<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Innocent One | Gothic Viking Fate</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.min.js"></script>
  <style>
    :root {
      --bg-dark: #0a080d;
      --card-bg: rgba(22, 17, 28, 0.95);
      --gold: #d4af37;
      --red-accent: #9e0b0b;
      --blue-accent: #1e4a7a;
      --text-light: #f0eaf5;
      --text-muted: #b8a8ca;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at center, #1c1128 0%, #050407 100%);
      color: var(--text-light);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 680px;
      width: 100%;
      background: var(--card-bg);
      border: 2px solid #3d2a4a;
      box-shadow: 0 0 35px rgba(0,0,0,0.9);
      border-radius: 16px;
      padding: 30px;
      text-align: center;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      color: var(--gold);
      font-size: 2.2rem;
      letter-spacing: 2px;
      margin-bottom: 5px;
      text-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
    }

    .subtitle {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 25px;
    }

    /* Dashboard */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: rgba(10, 8, 14, 0.8);
      border: 1px solid #332240;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 25px;
      font-size: 0.85rem;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .stat-value {
      color: var(--gold);
      font-weight: 700;
      font-size: 1rem;
    }

    /* Panels */
    .game-panel { display: none; }
    .game-panel.active { display: block; }

    /* Quiz Box Styling */
    .quiz-box {
      background: rgba(14, 10, 20, 0.85);
      border: 1px solid #422d52;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      color: var(--gold);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .question-title {
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      color: #ffffff;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .option-btn {
      background: #1b1324;
      border: 1px solid #4a345c;
      color: var(--text-light);
      padding: 14px 18px;
      border-radius: 8px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .option-btn:hover {
      border-color: var(--gold);
      background: #2b1d3a;
    }

    .option-btn.correct {
      background: #0d381e !important;
      border-color: #2ecc71 !important;
      color: #2ecc71 !important;
      font-weight: bold;
    }

    .option-btn.wrong {
      background: #420f0f !important;
      border-color: #e74c3c !important;
      color: #e74c3c !important;
    }

    .next-btn {
      background: linear-gradient(135deg, #3d2a4a, #23172e);
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 12px 30px;
      border-radius: 25px;
      cursor: pointer;
      display: none;
      margin-top: 15px;
      text-transform: uppercase;
    }

    .next-btn:hover {
      background: #4f3363;
    }

    /* Dice Layer Styling */
    .dice-area {
      display: flex;
      justify-content: space-around;
      margin: 25px 0;
      gap: 20px;
    }

    .dice-box {
      flex: 1;
      background: rgba(10, 8, 14, 0.7);
      border-radius: 12px;
      padding: 20px 10px;
      border: 1px solid #332240;
    }

    .dice {
      width: 80px;
      height: 80px;
      margin: 15px auto;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      font-weight: 700;
      font-family: 'Cinzel', serif;
    }

    .dice-red {
      background: linear-gradient(145deg, #500000, #1a0000);
      border: 2px solid var(--red-accent);
      color: #ffcccc;
    }

    .dice-blue {
      background: linear-gradient(145deg, #0a2540, #020b14);
      border: 2px solid var(--blue-accent);
      color: #ccf2ff;
    }

    .roll-btn {
      background: linear-gradient(180deg, #8b0000 0%, #4a0000 100%);
      border: 2px solid var(--gold);
      color: var(--gold);
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 1.2rem;
      padding: 15px 40px;
      border-radius: 30px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .result-card {
      margin-top: 25px;
      background: rgba(15, 10, 20, 0.95);
      border: 1px dashed var(--gold);
      border-radius: 10px;
      padding: 22px;
      display: none;
    }

    .action-btn {
      background: #23172e;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>The Innocent One's Trial</h1>
    <div class="subtitle">ᚱᚢᚾᛖ Knowledge, Fate & Consequences ᚱᚢᚾᛖ</div>

    <div class="dashboard">
      <div class="stat-box"><span class="stat-label">Correct</span><span class="stat-value" id="correctCount" style="color: #2ecc71;">0</span></div>
      <div class="stat-box"><span class="stat-label">Wrong</span><span class="stat-value" id="wrongCount" style="color: #e74c3c;">0</span></div>
      <div class="stat-box"><span class="stat-label">Level</span><span class="stat-value" id="diffLevel">1</span></div>
      <div class="stat-box"><span class="stat-label">Streak</span><span class="stat-value" id="streakCount">0</span></div>
    </div>

    <!-- QUIZ PANEL -->
    <div id="quizPanel" class="game-panel active">
      <div class="quiz-box">
        <div class="question-header">
          <span id="questionCategory">Category</span>
          <span id="questionTierText">Tier: 1</span>
        </div>
        <div class="question-title" id="questionText">Loading...</div>
        <div class="options-grid" id="optionsGrid"></div>
        <button class="next-btn" id="nextQuestionBtn" onclick="proceedNext()">Next Question ➔</button>
      </div>
    </div>

    <!-- DICE PANEL -->
    <div id="dicePanel" class="game-panel">
      <div style="font-family: 'Cinzel', serif; color: var(--gold); margin-bottom: 15px; font-size: 1.15rem;" id="diceInstruction">Fate is sealed! Cast your dice.</div>
      <div class="dice-area">
        <div class="dice-box">
          <div style="color: #ff6b6b; font-family: 'Cinzel', serif;">Action (Red)</div>
          <div class="dice dice-red" id="diceRed">ᚠ</div>
        </div>
        <div class="dice-box">
          <div style="color: #64dfdf; font-family: 'Cinzel', serif;">Duration (Blue)</div>
          <div class="dice dice-blue" id="diceBlue">ᚢ</div>
        </div>
      </div>
      <button class="roll-btn" onclick="rollDice()">Cast the Dice</button>
      <div class="result-card" id="resultCard">
        <h3 id="resultHeader" style="font-family:'Cinzel',serif; color:var(--gold); margin-bottom:10px;">Fate Has Decided</h3>
        <div class="outcome-text" style="font-size: 1.1rem; line-height: 1.6;">
          <span id="redOutcome" style="color:#ff6b6b; font-weight:600;"></span><br>
          <span id="blueOutcome" style="color:#64dfdf; font-weight:600;"></span>
        </div>
        <button class="action-btn" onclick="resetToQuiz()">Return to Trial</button>
      </div>
    </div>
  </div>

  <script>
    const questionBank = {
      1: [
        { category: "Geography", q: "What is the capital city of Scotland?", options: ["Glasgow", "Edinburgh", "Aberdeen", "Dundee"], answer: 1 },
        { category: "Pop Culture", q: "Which element on the periodic table has the chemical symbol 'O'?", options: ["Gold", "Osmium", "Oxygen", "Zinc"], answer: 2 },
        { category: "General Knowledge", q: "How many sides does a standard hexagon have?", options: ["5", "6", "7", "8"], answer: 1 }
      ],
      2: [
        { category: "History", q: "In which year did the Battle of Hastings take place in England?", options: ["1066", "1215", "1415", "1588"], answer: 0 },
        { category: "Nature & Animals", q: "What is the largest mammal currently living on Earth?", options: ["African Elephant", "Blue Whale", "Colossal Squid", "Giraffe"], answer: 1 },
        { category: "Literature", q: "Who wrote the classic Gothic novel 'Frankenstein'?", options: ["Bram Stoker", "Mary Shelley", "Jane Austen", "Charles Dickens"], answer: 1 }
      ],
      3: [
        { category: "Human Anatomy", q: "Which organ in the human body consumes roughly 20% of the body's total oxygen intake?", options: ["Lungs", "Heart", "Liver", "Brain"], answer: 3 },
        { category: "World History", q: "Which ancient civilization constructed the city of Machu Picchu high in the Andes?", options: ["Aztecs", "Mayans", "Incas", "Toltecs"], answer: 2 },
        { category: "Physics & Chemistry", q: "What is the hardest naturally occurring substance found on Earth?", options: ["Titanium", "Diamond", "Quartz", "Graphene"], answer: 1 }
      ],
      4: [
        { category: "Astronomy & Physics", q: "What is the theoretical boundary surrounding a black hole beyond which nothing can escape?", options: ["Photon Sphere", "Singularity", "Event Horizon", "Accretion Disk"], answer: 2 },
        { category: "World History", q: "Who was the first Emperor of a unified China, famous for his Terracotta Army?", options: ["Qin Shi Huang", "Kublai Khan", "Sun Tzu", "Emperor Wu of Han"], answer: 0 },
        { category: "Classical Literature", q: "In Norse mythology, what is the name of the great hall ruled over by the god Odin?", options: ["Asgard", "Valhalla", "Midgard", "Niflheim"], answer: 1 }
      ],
      5: [
        { category: "Philosophy & Science", q: "Which ancient philosopher formulated the famous line 'I think, therefore I am' (Cogito, ergo sum)?", options: ["Spinoza", "Immanuel Kant", "René Descartes", "Friedrich Nietzsche"], answer: 2 },
        { category: "Botany & Science", q: "What pigment gives red, purple, and blue plants their vibrant colors and acts as an antioxidant?", options: ["Chlorophyll", "Anthocyanin", "Carotenoid", "Xanthophyll"], answer: 1 },
        { category: "History & Antiquity", q: "The Roman Empire reached its greatest geographical expanse under which Emperor in 117 AD?", options: ["Augustus", "Trajan", "Hadrian", "Marcus Aurelius"], answer: 1 }
      ]
    };

    let currentLevel = 1;
    let streak = 0;
    let totalCorrect = 0;
    let totalWrong = 0;
    let currentQ = null;
    let activeRuleKey = null;
    let pendingTrigger = null;

    const rules = {
      right3: {
        title: "3 Right in a Row — Reward",
        red: { 1: "Lick ass", 2: "Suck cock", 3: "Kiss", 4: "Ball play", 5: "Lick ass & milk cock together", 6: "Lick nipples" },
        blue: { 1: "5 mins", 2: "10 times", 3: "15 seconds", 4: "15 times", 5: "10 mins", 6: "You choose" }
      },
      wrong2: {
        title: "2 Wrong in a Row — Penance",
        red: { 1: "Smack in ass", 2: "Pull nipples", 3: "Bite neck", 4: "Slap cock", 5: "Slap face", 6: "U choose" },
        blue: { 1: "10 second", 2: "4 times", 3: "U choose", 4: "15 times", 5: "5 mins", 6: "I choose" }
      },
      wrong4: {
        title: "4 Wrong in a Row — Severe Punishment",
        red: { 1: "Chest smacked", 2: "cock pulled", 3: "Balls squeeze", 4: "Kick in balls", 5: "Back slapped", 6: "U choose" },
        blue: { 1: "I choose", 2: "6 times", 3: "You choose", 4: "5 mins", 5: "11 mins", 6: "20 times" }
      }
    };

    function loadQuestion() {
      document.getElementById('nextQuestionBtn').style.display = 'none';
      const tierList = questionBank[currentLevel] || questionBank[1];
      currentQ = tierList[Math.floor(Math.random() * tierList.length)];

      document.getElementById('questionCategory').innerText = currentQ.category;
      document.getElementById('questionTierText').innerText = `Tier: ${currentLevel}`;
      document.getElementById('questionText').innerText = currentQ.q;

      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';
      currentQ.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<b>${String.fromCharCode(65 + idx)}.</b> ${opt}`;
        btn.onclick = () => selectOption(idx, btn);
        grid.appendChild(btn);
      });
    }

    function selectOption(idx, clickedBtn) {
      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(b => b.disabled = true);

      const isCorrect = (idx === currentQ.answer);

      if (isCorrect) {
        clickedBtn.classList.add('correct');
        totalCorrect++;
        if (streak < 0) streak = 1;
        else streak++;

        if (streak > 1 && currentLevel < 5) currentLevel++;
        confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
      } else {
        clickedBtn.classList.add('wrong');
        allBtns[currentQ.answer].classList.add('correct');
        totalWrong++;
        if (streak > 0) streak = -1;
        else streak--;
      }

      updateDashboard();

      // Set trigger conditions
      if (streak >= 3) {
        pendingTrigger = 'right3';
      } else if (streak <= -4) {
        pendingTrigger = 'wrong4';
      } else if (streak <= -2) {
        pendingTrigger = 'wrong2';
      } else {
        pendingTrigger = null;
      }

      document.getElementById('nextQuestionBtn').style.display = 'inline-block';
    }

    function proceedNext() {
      if (pendingTrigger) {
        triggerDice(pendingTrigger);
        pendingTrigger = null;
      } else {
        loadQuestion();
      }
    }

    function updateDashboard() {
      document.getElementById('correctCount').innerText = totalCorrect;
      document.getElementById('wrongCount').innerText = totalWrong;
      document.getElementById('diffLevel').innerText = currentLevel;
      document.getElementById('streakCount').innerText = streak;
    }

    function triggerDice(ruleKey) {
      activeRuleKey = ruleKey;
      document.getElementById('quizPanel').classList.remove('active');
      document.getElementById('dicePanel').classList.add('active');
      document.getElementById('diceInstruction').innerText = `Triggered: ${rules[ruleKey].title}! Cast the dice.`;
      document.getElementById('resultCard').style.display = 'none';
      document.getElementById('diceRed').innerText = 'ᚠ';
      document.getElementById('diceBlue').innerText = 'ᚢ';
    }

    function resetToQuiz() {
      streak = 0;
      updateDashboard();
      document.getElementById('dicePanel').classList.remove('active');
      document.getElementById('quizPanel').classList.add('active');
      loadQuestion();
    }

    function rollDice() {
      const redDice = document.getElementById('diceRed');
      const blueDice = document.getElementById('diceBlue');
      const resultCard = document.getElementById('resultCard');
      resultCard.style.display = 'none';

      let count = 0;
      const interval = setInterval(() => {
        redDice.innerText = Math.floor(Math.random() * 6) + 1;
        blueDice.innerText = Math.floor(Math.random() * 6) + 1;
        count++;
        if (count > 10) {
          clearInterval(interval);
          const rVal = Math.floor(Math.random() * 6) + 1;
          const bVal = Math.floor(Math.random() * 6) + 1;
          redDice.innerText = rVal;
          blueDice.innerText = bVal;

          const ruleSet = rules[activeRuleKey];
          document.getElementById('resultHeader').innerText = ruleSet.title;
          document.getElementById('redOutcome').innerText = `Action: ${ruleSet.red[rVal]}`;
          document.getElementById('blueOutcome').innerText = `Duration/Count: ${ruleSet.blue[bVal]}`;
          resultCard.style.display = 'block';
        }
      }, 70);
    }

    window.onload = loadQuestion;
  </script>
</body>
</html>
